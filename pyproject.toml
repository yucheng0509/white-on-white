[project]
name = "white-on-white"
version = "0.1.0"
description = "白紙白字 —— 專為組織設計的 AI 履歷篩選操控演練平台"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "anthropic",
    "google-genai",
    "python-dotenv",
    "pypdf",
    "python-multipart",
]

# 兩處都要：uv sync 讀 dependency-groups（PEP 735），
# pip install -e ".[dev]" 讀 optional-dependencies。
[project.optional-dependencies]
dev = ["pytest"]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drill"]
