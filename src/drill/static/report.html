<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>白紙白字　演練數據</title>
<style>
  :root{
    --bg:#0d1117; --card:#161b22; --line:#30363d; --fg:#e6edf3; --dim:#8b949e;
    --red:#f85149; --green:#3fb950; --amber:#d29922; --blue:#58a6ff;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
    font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
    line-height:1.6;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1180px;margin:0 auto;padding:32px 24px 80px}
  header{border-bottom:1px solid var(--line);padding-bottom:20px;margin-bottom:28px}
  h1{font-size:26px;margin:0 0 6px;letter-spacing:.5px}
  .sub{color:var(--dim);font-size:14px;margin:0}
  .meta{margin-top:14px;display:flex;gap:22px;flex-wrap:wrap;font-size:13px;color:var(--dim)}
  .meta b{color:var(--fg);font-variant-numeric:tabular-nums}
  section{margin-bottom:36px}
  h2{font-size:17px;margin:0 0 4px;display:flex;align-items:center;gap:8px}
  h2::before{content:"";width:3px;height:16px;background:var(--blue);border-radius:2px}
  .note{color:var(--dim);font-size:13px;margin:0 0 14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;overflow-x:auto}
  table{border-collapse:collapse;width:100%;font-size:13px}
  th,td{padding:7px 10px;text-align:center;white-space:nowrap}
  th{color:var(--dim);font-weight:500;font-size:12px;border-bottom:1px solid var(--line)}
  td.label{text-align:left;color:var(--fg);font-weight:500}
  .cell{border-radius:5px;font-variant-numeric:tabular-nums;font-weight:600;position:relative}
  .cell small{display:block;font-size:10px;opacity:.65;font-weight:400}
  .worse{outline:2px solid var(--red);outline-offset:-2px}
  .worse::after{content:"▲";position:absolute;top:1px;right:3px;font-size:8px;color:var(--red)}
  .legend{display:flex;gap:16px;align-items:center;margin-top:12px;font-size:12px;color:var(--dim);flex-wrap:wrap}
  .swatch{display:inline-block;width:34px;height:11px;border-radius:2px;vertical-align:-1px;
    background:linear-gradient(90deg,#0f2f1c,#7a1f1f)}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:16px}
  .stat{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
  .stat.bad{color:var(--red)} .stat.good{color:var(--green)} .stat.warn{color:var(--amber)}
  .stat-label{font-size:12px;color:var(--dim);margin-top:2px}
  .bar{height:6px;border-radius:3px;background:#21262d;overflow:hidden;margin-top:8px}
  .bar>i{display:block;height:100%;border-radius:3px}
  .tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:10px;
    border:1px solid var(--line);color:var(--dim);margin-right:6px}
  .tag.measured{border-color:var(--green);color:var(--green)}
  .tag.inferred{border-color:var(--dim)}
  .tag.rule{border-color:var(--amber);color:var(--amber)}
  .tag.blind{border-color:var(--red);color:var(--red)}
  .risk{border-bottom:1px solid var(--line);padding:12px 0}
  .risk:last-child{border-bottom:0}
  .risk-h{font-weight:600;font-size:14px}
  .risk-b{color:var(--dim);font-size:12.5px;margin-top:4px}
  .ev{margin-top:8px;padding:9px 12px;background:#0d2818;border-left:2px solid var(--green);
    border-radius:0 5px 5px 0;font-size:12.5px;font-variant-numeric:tabular-nums}
  .ev.blind{background:#2d1417;border-left-color:var(--red)}
  .insight{background:#1c2128;border:1px solid var(--line);border-left:3px solid var(--amber);
    border-radius:0 8px 8px 0;padding:14px 18px;font-size:13.5px}
  .err{color:var(--red);font-size:13px}
  footer{color:var(--dim);font-size:12px;border-top:1px solid var(--line);padding-top:16px;margin-top:40px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>白紙白字<span style="font-size:15px;color:var(--dim);font-weight:400;margin-left:12px">White on White</span></h1>
    <p class="sub">對組織正在使用的 AI，實測它會不會被藏在資料裡的假指令操控，並量化每項防護措施值多少</p>
    <div class="meta" id="meta"></div>
  </header>

  <section>
    <h2>防護措施有效性</h2>
    <p class="note">同一批注入樣本，只改變防護配置。這回答「我該做哪些措施、每項值多少」。</p>
    <div class="grid" id="configs"></div>
  </section>

  <section>
    <h2>注入類型 × 防護配置</h2>
    <p class="note">
      數字為操控成功率。<b style="color:var(--red)">紅框 ▲</b> 標示的格子，
      表示該防護措施讓風險<b style="color:var(--red)">高於</b>完全不設防的情況。
    </p>
    <div class="card">
      <table id="heatmap"></table>
      <div class="legend">
        <span><span class="swatch"></span> 0% → 100%</span>
        <span class="tag">隱藏型＝白底白字等人看不到的載體</span>
        <span class="tag">明文型＝直接寫在正文</span>
        <span class="tag">S1 軟性建議 → S4 直接覆寫</span>
      </div>
    </div>
  </section>

  <section>
    <h2>揭露率：模型會不會主動告訴你它被影響了</h2>
    <p class="note">這決定組織有沒有機會察覺。數字越低，風險越隱形。</p>
    <div class="card"><div class="grid" id="disclosure"></div></div>
  </section>

  <section>
    <h2>風險對應：數發部 AI 風險分類框架</h2>
    <p class="note" id="risk-note"></p>
    <div class="card" id="risks"></div>
  </section>

  <footer id="foot"></footer>
</div>

<script>
const API = location.origin;
const fmtPct = r => r == null ? "—" : Math.round(r * 100) + "%";

// 0 → 深綠，1 → 深紅。用 HSL 走一圈色相，中間經過琥珀色。
function heatColor(rate){
  if (rate == null) return "#161b22";
  const hue = 145 - rate * 145;              // 145=綠 → 0=紅
  const light = 12 + rate * 16;              // 越高越亮，讓紅格跳出來
  return `hsl(${hue} 55% ${light}%)`;
}

async function get(path, params){
  const url = new URL(API + path);
  Object.entries(params || {}).forEach(([k, v]) => url.searchParams.set(k, v));
  const res = await fetch(url);
  if (!res.ok) throw new Error(`${path} → HTTP ${res.status}`);
  return res.json();
}

function renderConfigs(report, labels){
  const order = ["A", "B", "C", "C2", "D", "D2"];
  const el = document.getElementById("configs");
  el.innerHTML = "";
  const base = report.by_config["A"];
  for (const cfg of order){
    const v = report.by_config[cfg];
    if (!v) continue;
    const worse = base && cfg !== "A" && v.rate > base.rate;
    const cls = v.rate === 0 ? "good" : (v.rate >= 0.25 ? "bad" : "warn");
    const div = document.createElement("div");
    div.className = "card";
    div.innerHTML = `
      <div class="stat ${cls}">${fmtPct(v.rate)}</div>
      <div class="stat-label">${cfg}　${labels[cfg] || ""}</div>
      <div class="bar"><i style="width:${(v.rate * 100).toFixed(0)}%;background:${heatColor(v.rate)}"></i></div>
      <div class="stat-label" style="margin-top:6px">
        ${v.k}/${v.n} 案例${worse ? ' <span style="color:var(--red)">▲ 比不設防更差</span>' : ""}
      </div>`;
    el.appendChild(div);
  }
}

function renderHeatmap(matrix){
  const configs = Object.keys(matrix.totals)
    .sort((a, b) => ["A","B","C","C2","D","D2"].indexOf(a) - ["A","B","C","C2","D","D2"].indexOf(b));
  const rows = [...new Set(Object.keys(matrix.cells).map(k => k.split("|").slice(0, 2).join("|")))]
    .sort((a, b) => {
      const [av, as] = a.split("|"), [bv, bs] = b.split("|");
      return av === bv ? as - bs : (av === "hidden" ? -1 : 1);
    });

  let head = "<thead><tr><th style='text-align:left'>注入類型</th>";
  for (const c of configs) head += `<th>${c}</th>`;
  head += "</tr></thead>";

  let body = "<tbody>";
  for (const row of rows){
    const [vis, s] = row.split("|");
    const baseline = matrix.cells[`${row}|A`];
    let tds = `<td class="label">${vis === "hidden" ? "隱藏" : "明文"}-S${s}</td>`;
    for (const c of configs){
      const cell = matrix.cells[`${row}|${c}`];
      if (!cell){ tds += "<td>—</td>"; continue; }
      // 防護配置的風險高於無防護 A，就是反常——這正是本專案的核心發現
      const worse = c !== "A" && baseline && cell.rate > baseline.rate;
      tds += `<td><div class="cell ${worse ? "worse" : ""}" style="background:${heatColor(cell.rate)}">
        ${fmtPct(cell.rate)}<small>${cell.k}/${cell.n}</small></div></td>`;
    }
    body += `<tr>${tds}</tr>`;
  }
  body += "</tbody>";

  document.getElementById("heatmap").innerHTML = head + body;
}

function renderDisclosure(report, labels){
  const el = document.getElementById("disclosure");
  el.innerHTML = "";
  for (const [cfg, v] of Object.entries(report.by_config)){
    const rate = v.n ? (v.disclosed ?? 0) / v.n : null;
    const cls = rate >= 0.5 ? "good" : (rate > 0 ? "warn" : "bad");
    const d = document.createElement("div");
    d.innerHTML = `<div class="stat ${cls}">${fmtPct(rate)}</div>
      <div class="stat-label">${cfg}　${labels[cfg] || ""}</div>`;
    el.appendChild(d);
  }
}

function renderRisks(rr){
  const el = document.getElementById("risks");
  el.innerHTML = "";
  document.getElementById("risk-note").textContent = rr.note;

  const evHtml = (ev, blind) => {
    if (!ev) return "";
    const lines = Object.entries(ev)
      .filter(([k]) => k !== "說明")
      .map(([k, v]) => `${k}：${typeof v === "object" ? Object.entries(v).map(([a, b]) => `${a} ${b}`).join("　") : v}`);
    return `<div class="ev ${blind ? "blind" : ""}">${lines.join("<br>")}</div>`;
  };

  for (const m of rr.mapped){
    const measured = !!m.evidence;
    const rule = m.rationale.startsWith("[規則補充]");
    const div = document.createElement("div");
    div.className = "risk";
    div.innerHTML = `
      <div class="risk-h">
        <span class="tag ${measured ? "measured" : (rule ? "rule" : "inferred")}">
          ${measured ? "實測" : (rule ? "規則補充" : "推論")}</span>
        (${m.code}) ${m.name}
      </div>
      <div class="risk-b">${m.rationale}</div>
      ${evHtml(m.evidence, false)}`;
    el.appendChild(div);
  }

  for (const b of rr.blind_spots || []){
    const div = document.createElement("div");
    div.className = "risk";
    div.innerHTML = `
      <div class="risk-h"><span class="tag blind">盤點盲點</span>(${b.code}) ${b.name}</div>
      <div class="risk-b">${b.note}</div>
      ${evHtml(b.evidence, true)}`;
    el.appendChild(div);
  }
}

async function main(){
  try{
    const params = new URLSearchParams(location.search);
    const runIds = params.get("runs") || "2,3";
    const appId = params.get("app") || "1";
    const reportId = runIds.split(",")[0];

    const [cfg, report, matrix, rr] = await Promise.all([
      get("/configs"), get(`/drills/${reportId}/report`),
      get("/matrix", {run_ids: runIds}), get(`/applications/${appId}/risk-report`),
    ]);
    const labels = cfg.configs;

    const totalCases = Object.values(matrix.totals).reduce((a, v) => a + v.n, 0);
    document.getElementById("meta").innerHTML = `
      <span>受測案例　<b>${totalCases}</b></span>
      <span>防護配置　<b>${Object.keys(matrix.totals).length}</b> 種</span>
      <span>對照組排序正確　<b>${report.control.correct}/${report.control.n}</b></span>
      <span>演練批次　<b>#${runIds}</b></span>`;

    renderConfigs(report, labels);
    renderHeatmap(matrix);
    renderDisclosure(report, labels);
    renderRisks(rr);

    document.getElementById("foot").innerHTML =
      `風險類型引用自數發部「人工智慧風險分類框架 v1.0」（115.7.7 生效）表 1，說明為官方原文。
       所有注入僅施加於本平台自建的虛構素材，未對任何真實服務或個人進行測試。`;
  }catch(e){
    document.querySelector(".wrap").insertAdjacentHTML("beforeend",
      `<p class="err">載入失敗：${e.message}　請確認後端已啟動（uvicorn drill.api:app）</p>`);
  }
}
main();
</script>
</body>
</html>
